<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13202b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GatePass</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/vendor/jsQR.js" defer></script>
  <script src="/vendor/qrcode.js" defer></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#gate">
      <span class="brand-mark" data-icon="shield"></span>
      <span>GatePass</span>
    </a>
    <div class="topbar-actions">
      <button id="status" class="status-pill" type="button" data-tone="checking">
        <span class="dot"></span><span class="label">Checking…</span>
      </button>
      <a href="#settings" class="icon-btn profile-btn" aria-label="Shift and settings"><span data-icon="user"></span><b class="tab-badge" data-badge="log" hidden></b></a>
    </div>
  </header>

  <div id="sync-strip" class="sync-strip" hidden>
    <span class="sync-strip-icon"></span>
    <span class="sync-strip-text"></span>
    <button type="button" class="sync-strip-action">Sync now</button>
  </div>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#gate" data-route="gate"><span data-icon="qr"></span>Gate</a>
    <a href="#onsite" data-route="onsite"><span data-icon="users"></span>On site<b class="tab-badge tab-badge-neutral" data-badge="onsite" hidden></b></a>
    <a href="#incidents" data-route="incidents"><span data-icon="alert"></span>Incidents</a>
    <a href="#checks" data-route="checks"><span data-icon="clipboard"></span>Checks</a>
    <a href="#muster" data-route="muster" class="tab-muster"><span data-icon="siren"></span>Evacuate</a>
  </nav>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
