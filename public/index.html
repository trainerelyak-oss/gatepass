<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13202b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PatrolSync</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#patrol">
      <span class="brand-mark" data-icon="shield"></span>
      <span>PatrolSync</span>
    </a>
    <div class="topbar-actions">
      <button id="status" class="status-pill" type="button" data-tone="checking">
        <span class="dot"></span><span class="label">Checking…</span>
      </button>
      <a href="#settings" class="icon-btn" aria-label="Settings" data-icon="user"></a>
    </div>
  </header>

  <div id="sync-strip" class="sync-strip" hidden>
    <span class="sync-strip-icon"></span>
    <span class="sync-strip-text"></span>
    <button type="button" class="sync-strip-action">Sync now</button>
  </div>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#patrol" data-route="patrol"><span data-icon="route"></span>Patrol</a>
    <a href="#inspect" data-route="inspect"><span data-icon="clipboard"></span>Inspect</a>
    <a href="#incident" data-route="incident"><span data-icon="alert"></span>Report</a>
    <a href="#log" data-route="log"><span data-icon="list"></span>Log<b class="tab-badge" hidden></b></a>
  </nav>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
